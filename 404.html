<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
        // This script redirects any unknown route back to index.html,
        // preserving query strings and hash fragments.
        var redirectTo = '/myPortfolio/index.html' + window.location.search + window.location.hash;
        window.location.replace(redirectTo);
    </script>
    <title>Redirecting...</title>
</head>
<body>
    <p>If you are not redirected automatically, <a href="/myPortfolio/index.html">click here</a>.</p>
</body>
</html>
